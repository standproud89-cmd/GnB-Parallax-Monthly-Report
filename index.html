<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GnB 성적표 입력 시스템</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; }
      .student-name-input::placeholder { color: #e5e7eb; opacity: 1; }
      .score-input::placeholder { color: #9ca3af; opacity: 1; font-weight: 600; }
      .perf-label-kr { font-size: 10.5px; }

      @media print {
        @page { size: A4; margin: 10mm; }
        html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

        .print-hide { display: none !important; }

        #root, .app-shell, .step3-wrapper {
          max-width: none !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          min-height: 0 !important;
          background: #fff !important;
        }

        .report-card {
          box-shadow: none !important;
          border-radius: 0 !important;
          border: none !important;
          display: flex !important;
          flex-direction: column !important;
          min-height: 255mm !important;
          justify-content: space-between !important;
        }
        .report-header { padding: 6px 14px 3px !important; flex: 0 0 auto !important; }
        .report-section { margin: 6px 14px 0 !important; flex: 0 0 auto !important; }
        .report-section:last-child { margin-bottom: 6px !important; }
        .info-row { margin: 4px 24px 0 !important; flex: 0 0 auto !important; }
        .info-row > div { padding: 3px 12px !important; }
        .info-row > div > span:first-child { font-size: 8.5px !important; }
        .info-row > div > span:last-child { font-size: 11.5px !important; }
        .section-header { padding-bottom: 3px !important; }
        .section-header span:last-child { font-size: 12.5px !important; }
        .textbook-banner { padding: 6px 14px !important; font-size: 13px !important; }
        .report-footer { margin: 4px 24px 4px !important; padding-top: 4px !important; font-size: 9.5px !important; }

        .score-table td, .score-table th { padding: 2px 6px !important; font-size: 9.5px !important; }
        .perf-table td, .perf-table th { padding: 2px 6px !important; font-size: 9.5px !important; }
        .perf-table td:not(.perf-label-cell):not(.perf-group-label) { padding: 2px 6px !important; font-size: 9.5px !important; }
        .perf-group-label { padding: 2px 6px !important; font-size: 9.5px !important; }
        .perf-label-cell { line-height: 1.15 !important; display: table-cell !important; white-space: nowrap !important; }
        .perf-label-en { font-size: 9.5px !important; display: inline !important; }
        .perf-label-kr { font-size: 8.5px !important; display: inline !important; margin-left: 3px !important; }
        .grade-badge { font-size: 9px !important; width: 76px !important; padding: 2px 0 !important; }

        .chart-box, .radar-box { height: 183px !important; padding: 4px !important; }

        .comments-box {
          height: 29mm !important;
          min-height: 0 !important;
          max-height: 29mm !important;
          padding: 4px 10px !important;
          font-size: 10px !important;
          line-height: 1.4 !important;
          overflow: hidden !important;
          overflow-wrap: break-word !important;
          word-break: break-word !important;
          white-space: pre-wrap !important;
        }

        .print-page { page-break-after: always; }
        .print-page:last-child { page-break-after: auto; }
      }

      /* PDF 다운로드용 캡처 모드 - @media print과 동일한 수치를 고정 픽셀 폭으로 재현 (A4 794x1123px 기준, 안전 영역 약 730x1050px) */
      .pdf-capture-mode .report-card {
        width: 718px !important;
        min-height: 1010px !important;
        margin: 0 auto !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        border: none !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
      }
      .pdf-capture-mode .report-header { padding: 6px 14px 3px !important; flex: 0 0 auto !important; }
      .pdf-capture-mode .report-section { margin: 6px 14px 0 !important; flex: 0 0 auto !important; }
      .pdf-capture-mode .report-section:last-child { margin-bottom: 6px !important; }
      .pdf-capture-mode .info-row { margin: 4px 24px 0 !important; flex: 0 0 auto !important; }
      .pdf-capture-mode .info-row > div { padding: 3px 12px !important; }
      .pdf-capture-mode .info-row > div > span:first-child { font-size: 8.5px !important; }
      .pdf-capture-mode .info-row > div > span:last-child { font-size: 11.5px !important; }
      .pdf-capture-mode .section-header { padding-bottom: 3px !important; }
      .pdf-capture-mode .section-header span:last-child { font-size: 12.5px !important; }
      .pdf-capture-mode .textbook-banner { padding: 6px 14px !important; font-size: 13px !important; }
      .pdf-capture-mode .report-footer { margin: 4px 24px 4px !important; padding-top: 4px !important; font-size: 9.5px !important; }
      .pdf-capture-mode .score-table td, .pdf-capture-mode .score-table th { padding: 2px 6px !important; font-size: 9.5px !important; }
      .pdf-capture-mode .perf-table td, .pdf-capture-mode .perf-table th { padding: 2px 6px !important; font-size: 9.5px !important; }
      .pdf-capture-mode .perf-table td:not(.perf-label-cell):not(.perf-group-label) { padding: 2px 6px !important; font-size: 9.5px !important; }
      .pdf-capture-mode .perf-group-label { padding: 2px 6px !important; font-size: 9.5px !important; }
      .pdf-capture-mode .perf-label-cell { line-height: 1.15 !important; display: table-cell !important; white-space: nowrap !important; }
      .pdf-capture-mode .perf-label-en { font-size: 9.5px !important; display: inline !important; }
      .pdf-capture-mode .perf-label-kr { font-size: 8.5px !important; display: inline !important; margin-left: 3px !important; }
      .pdf-capture-mode .grade-badge { font-size: 9px !important; width: 76px !important; padding: 2px 0 !important; }
      .pdf-capture-mode .chart-box, .pdf-capture-mode .radar-box { height: 183px !important; padding: 4px !important; }
      .pdf-capture-mode .comments-box {
        height: 29mm !important;
        min-height: 0 !important;
        max-height: 29mm !important;
        padding: 4px 10px !important;
        font-size: 10px !important;
        line-height: 1.4 !important;
        overflow: hidden !important;
        overflow-wrap: break-word !important;
        word-break: break-word !important;
        white-space: pre-wrap !important;
      }
      /* ---- 모바일 전용 (PC 화면에는 영향 없음, 화면 폭 640px 이하일 때만 적용) ---- */
      @media screen and (max-width: 640px) {
        .landing-grid {
          grid-template-columns: 1fr !important;
        }
        .audio-book-row {
          flex-wrap: nowrap !important;
          gap: 8px !important;
        }
        .audio-book-label {
          width: 40% !important;
          flex: 0 0 40% !important;
          min-width: 0 !important;
          font-size: 12.5px !important;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .audio-level-boxes {
          flex-wrap: nowrap !important;
          gap: 5px !important;
          flex: 1 1 auto !important;
          justify-content: flex-start !important;
        }
        .audio-level-box {
          width: 28px !important;
          height: 28px !important;
          font-size: 12px !important;
          flex-shrink: 0 !important;
        }

        /* Step1 기본정보 입력 */
        input[type="date"] { min-width: 0 !important; width: 100% !important; }

        /* Step2 기본 정보 카드 - flex-wrap 대신 grid로 바꿔서 줄바꿈 시에도 칸 구분선이 어긋나지 않게 */
        .step2-info-grid {
          display: grid !important;
          grid-template-columns: 1fr 1fr !important;
        }
        .step2-info-cell {
          border-right: 1px solid #e5e7eb !important;
          border-bottom: 1px solid #e5e7eb !important;
        }
        .step2-info-cell:nth-child(2n) { border-right: none !important; }

        /* Step2 학생 성적 입력표 */
        .step2-toolbar { gap: 10px !important; }
        .step2-hint { display: none !important; } /* 모바일에선 안내 문구 숨겨서 버튼 줄이 안 밀리게 */
        .step2-toolbar-actions { width: 100% !important; margin-left: 0 !important; flex-direction: column !important; }
        .step2-toolbar-actions button { width: 100% !important; }
        .stepper-btn { width: 40px !important; height: 40px !important; font-size: 18px !important; }

        /* 한 화면에 학생 2명 정도 보이도록 라벨/만점/학생 열 폭을 JS에서 계산해서 적용 (useIsMobile) */
        .step2-table-scroll { -webkit-overflow-scrolling: touch; }

        /* Step3 최종 성적표 */
        .step3-toolbar { flex-direction: column !important; align-items: stretch !important; }
        .step3-nav { justify-content: center !important; }
        .step3-actions { flex-direction: column !important; }
        .step3-actions button { width: 100% !important; }

        .report-header { flex-direction: column !important; gap: 10px !important; padding: 16px 16px 8px !important; }
        .report-logo-row { justify-content: center !important; }
        .signature-row { justify-content: center !important; }
        .signature-box { width: 80px !important; }

        .info-row { flex-wrap: wrap !important; }
        .info-row > div { flex: 1 1 50% !important; box-sizing: border-box !important; border-bottom: 1px solid #e5e7eb !important; }
        .info-row > div:nth-child(2n) { border-right: none !important; }

        .score-table, .perf-table { font-size: 11px !important; }
        .score-table td, .score-table th { padding: 6px 4px !important; }
        .perf-table td, .perf-table th { padding: 5px 4px !important; }
        .grade-badge { width: auto !important; min-width: 0 !important; padding: 3px 8px !important; font-size: 10px !important; }
      }

      /* ---- 태블릿 전용 (641px ~ 1024px, PC/모바일 규칙에는 영향 없음) ---- */
      @media screen and (min-width: 641px) and (max-width: 1024px) {
        .step3-actions { flex-wrap: wrap !important; justify-content: flex-end !important; }
        .stepper-btn { width: 38px !important; height: 38px !important; }
        .score-table, .perf-table { font-size: 12px !important; }
      }

      /* ---- 대문 화면 PC 전용 확대 (641px 이상, 모바일은 그대로 유지) ---- */
      @media screen and (min-width: 641px) {
        .landing-container { max-width: 900px !important; }
        .landing-logo { height: 112px !important; }
        .landing-grid { gap: 22px !important; }
        .landing-card { padding: 34px 26px 26px !important; border-width: 3px !important; }
        .landing-card-icon { width: 76px !important; height: 76px !important; border-radius: 20px !important; font-size: 38px !important; margin-bottom: 18px !important; }
        .landing-card-badge { font-size: 13px !important; padding: 4px 12px !important; border-radius: 8px !important; margin-bottom: 12px !important; }
        .landing-card-title { font-size: 28px !important; }
        .landing-card-desc { font-size: 15px !important; margin: 8px 0 18px !important; }
        .landing-card-cta { font-size: 17px !important; }
      }

      /* ---- 레벨 선택 숫자 박스 PC 전용 호버 효과 (음원 듣기/답안지 보기/시험지 다운로드 화면, 모바일은 제외) ---- */
      @media screen and (min-width: 641px) {
        .audio-level-box:not(:disabled):hover {
          background: var(--level-accent, #111827) !important;
          color: #fff !important;
          border-color: var(--level-accent, #111827) !important;
          transform: translateY(-2px);
          box-shadow: 0 8px 16px color-mix(in srgb, var(--level-accent, #111827) 35%, transparent);
        }
        .audio-level-box { transition: background .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease; }
      }

      /* ---- 최종 성적표 표 PC 전용 확대 (화면에서 보는 용도만, 인쇄/이미지 저장 캡처 크기는 절대 변경 안 됨) ---- */
      @media screen and (min-width: 641px) {
        .score-table th, .perf-table th { font-size: 15px !important; padding: 10px 10px !important; }
        .score-table td { font-size: 15px !important; padding: 10px 10px !important; }
        .perf-group-label { font-size: 15px !important; padding: 10px 10px !important; }
        .perf-table td:not(.perf-label-cell):not(.perf-group-label) { font-size: 15px !important; padding: 10px 10px !important; }
        .perf-label-cell { white-space: nowrap !important; padding: 10px 10px !important; }
        .perf-label-en { display: inline !important; font-size: 15px !important; }
        .perf-label-kr { display: inline !important; font-size: 13px !important; margin-left: 5px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
